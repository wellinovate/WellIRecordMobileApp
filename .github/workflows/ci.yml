name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Type-check the app
        run: npx tsc --noEmit -p tsconfig.app.json
      - name: Lint
        run: npm run lint
      - name: Install server packages (root tests import server code)
        run: npm ci --no-audit --no-fund --prefix server
      - name: Tests
        run: npm test
      - name: Check that Metro bundles for Android
        run: CI=1 npx expo export --platform android --output-dir /tmp/export
        env:
          EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_ci_placeholder

  server:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1})'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Type-check and build the server
        run: npx tsc --noEmit
      - name: Tests
        run: npm test
      - name: Integration tests (real MongoDB)
        run: npm run test:integration
        env:
          MONGODB_URI_TEST: mongodb://127.0.0.1:27017
      - name: Dependency audit (fails on high or critical)
        run: npm audit --omit=dev --audit-level=high

  app-audit:
    # Informational. The findings are in build tooling that does not ship in the app; see docs/security/dependency-audit.md.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm audit --omit=dev --audit-level=critical
